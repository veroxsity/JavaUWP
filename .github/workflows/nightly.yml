name: Native branch build

on:
  push:
    branches:
      - main-native
    paths:
      - ".github/workflows/nightly.yml"
      - "MC.Xbox/**"
      - "glfw_shim/**"
      - "compat_mod/**"
      - "controller_mod/**"
      - "patch/**"
      - "scripts/**"
      - "log_configs/**"
      - "mesa-runtime/**"
      - "build.ps1"
      - "xbox_security.properties"
  workflow_dispatch:

concurrency:
  group: main-native-nightly-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build native package
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Export JDK 17 path
        shell: powershell
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "JDK 17: $env:JAVA_HOME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Export JDK 21 path
        shell: powershell
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "JDK 21: $env:JAVA_HOME"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Clean generated outputs
        shell: powershell
        run: .\scripts\clean.ps1 -Apply

      - name: Restore Fabric remap cache
        uses: actions/cache@v4
        with:
          path: staging/cache/gameDir/.fabric/remappedJars
          key: fabric-remap-${{ runner.os }}-${{ hashFiles('scripts/config.ps1') }}

      - name: Restore loader installer cache
        uses: actions/cache@v4
        with:
          path: staging/cache/loader-installers
          key: loader-installers-${{ runner.os }}-${{ hashFiles('config/versions.tsv') }}
          restore-keys: |
            loader-installers-${{ runner.os }}-

      - name: Restore download manifest cache
        uses: actions/cache@v4
        with:
          path: staging/cache/manifests
          key: manifests-${{ runner.os }}-${{ hashFiles('config/versions.tsv', 'scripts/new-download-manifest.ps1', 'scripts/common.ps1') }}
          restore-keys: |
            manifests-${{ runner.os }}-

      - name: Restore patched loader clients
        uses: actions/cache@v4
        with:
          path: prebuilt
          key: prebuilt-${{ runner.os }}-${{ hashFiles('config/versions.tsv', 'scripts/prepare-forge-patched-client.ps1', 'scripts/gen-neoforge-artifacts.ps1') }}
          restore-keys: |
            prebuilt-${{ runner.os }}-

      - name: Prepare build cache
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Resolve package version
        shell: powershell
        run: |
          [xml]$manifest = Get-Content MC.Xbox\Package.appxmanifest
          $parts = ([string]$manifest.Package.Identity.Version) -split '\.'
          if ($parts.Count -ne 4) { throw "Invalid package version" }
          $revision = [int]$env:GITHUB_RUN_NUMBER
          if ($revision -gt 65535) { throw "APPX revision exceeded 65535" }
          $version = "$($parts[0]).$($parts[1]).$($parts[2]).$revision"
          "APPX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APPX_FILE=BanditLauncherNative_$version.appx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build APPX
        shell: powershell
        run: .\build.ps1 -SkipStopAppProcesses -AppxVersion $env:APPX_VERSION

      - name: Stage nightly asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "output\$env:APPX_FILE" dist\BanditLauncherNative-nightly.appx -Force
          $hash = Get-FileHash dist\BanditLauncherNative-nightly.appx -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  BanditLauncherNative-nightly.appx" | Set-Content -Path dist\BanditLauncherNative-nightly.sha256 -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanditLauncherNative-nightly
          path: |
            dist/BanditLauncherNative-nightly.appx
            dist/BanditLauncherNative-nightly.sha256
          if-no-files-found: error
