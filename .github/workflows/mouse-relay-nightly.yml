name: Mouse relay nightly

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mouse-relay-nightly.yml"
      - "tools/mouse-relay/**"
  workflow_dispatch:

concurrency:
  group: mouse-relay-nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  MOUSE_RELAY_NIGHTLY_TAG: mouse-relay-nightly
  MOUSE_RELAY_NIGHTLY_TITLE: Mouse Relay Nightly

jobs:
  windows:
    name: Build Windows portable zip
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Windows relay
        shell: powershell
        run: .\tools\mouse-relay\scripts\package-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanditMouseRelay-nightly-win-x64
          path: |
            dist/mouse-relay/BanditMouseRelay-nightly-win-x64.zip
            dist/mouse-relay/BanditMouseRelay-nightly-win-x64.sha256
          if-no-files-found: error

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build Android APK
        working-directory: tools/mouse-relay/android
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage Android artifact
        shell: bash
        run: |
          mkdir -p dist/mouse-relay
          cp tools/mouse-relay/android/app/build/outputs/apk/debug/app-debug.apk dist/mouse-relay/BanditMouseRelay-nightly-android-debug.apk
          cd dist/mouse-relay
          sha256sum BanditMouseRelay-nightly-android-debug.apk > BanditMouseRelay-nightly-android-debug.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanditMouseRelay-nightly-android-debug
          path: |
            dist/mouse-relay/BanditMouseRelay-nightly-android-debug.apk
            dist/mouse-relay/BanditMouseRelay-nightly-android-debug.sha256
          if-no-files-found: error

  ios:
    name: Build iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure iOS project
        shell: bash
        run: |
          cmake -S tools/mouse-relay -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build iOS app bundle
        shell: bash
        run: cmake --build build/ios --config Release

      - name: Stage iOS artifact
        shell: bash
        run: |
          set -euo pipefail
          app="$(find build/ios -maxdepth 3 -name 'BanditMouseRelay.app' -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "no BanditMouseRelay.app produced"
            find build/ios -maxdepth 3 -name '*.app' -o -maxdepth 3 -name 'Release*' -type d
            exit 1
          fi
          echo "bundling $app"
          # an ipa is just a zip with the bundle under Payload/
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          mkdir -p dist/mouse-relay
          ( cd build/ipa && zip -qry "$GITHUB_WORKSPACE/dist/mouse-relay/BanditMouseRelay-nightly-ios.ipa" Payload )
          cd dist/mouse-relay
          shasum -a 256 BanditMouseRelay-nightly-ios.ipa > BanditMouseRelay-nightly-ios.sha256

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanditMouseRelay-nightly-ios
          path: |
            dist/mouse-relay/BanditMouseRelay-nightly-ios.ipa
            dist/mouse-relay/BanditMouseRelay-nightly-ios.sha256
          if-no-files-found: error

  publish:
    name: Publish mouse relay assets
    runs-on: ubuntu-latest
    # experimental branches build but must not clobber the nightly release
    if: github.ref == 'refs/heads/main'
    needs:
      - windows
      - android
      - ios
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Move mouse relay nightly tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MOUSE_RELAY_NIGHTLY_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MOUSE_RELAY_NIGHTLY_TAG"

      - name: Publish to mouse relay nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$MOUSE_RELAY_NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release create "$MOUSE_RELAY_NIGHTLY_TAG" --target "$GITHUB_SHA" --title "$MOUSE_RELAY_NIGHTLY_TITLE" --prerelease --notes "Automated nightly mouse relay builds."
          fi

          gh release upload "$MOUSE_RELAY_NIGHTLY_TAG" \
            dist/BanditMouseRelay-nightly-win-x64/BanditMouseRelay-nightly-win-x64.zip \
            dist/BanditMouseRelay-nightly-win-x64/BanditMouseRelay-nightly-win-x64.sha256 \
            dist/BanditMouseRelay-nightly-android-debug/BanditMouseRelay-nightly-android-debug.apk \
            dist/BanditMouseRelay-nightly-android-debug/BanditMouseRelay-nightly-android-debug.sha256 \
            dist/BanditMouseRelay-nightly-ios/BanditMouseRelay-nightly-ios.ipa \
            dist/BanditMouseRelay-nightly-ios/BanditMouseRelay-nightly-ios.sha256 \
            --clobber
