name: Babric Xbox Controller

on:
  push:
    branches:
      - feature/sdl3-minecraft-26.3-26.4
      - stable
    paths:
      - "controller_mod/babric/**"
      - ".github/workflows/babric-controller.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-babric-controller:
    name: Build Beta 1.7.3 Babric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build mod
        working-directory: controller_mod/babric
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v6
        with:
          name: onyx-xbox-controller-babric-b1.7.3
          path: controller_mod/babric/build/libs/onyx-xbox-controller-*.jar
          if-no-files-found: error
